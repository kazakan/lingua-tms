[package]
name = "lingua-tms"
description = "Lingua TMS 데스크톱 앱(Tauri 2). 화면 명령만 두고 로직은 tms-core 에 둔다."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# 바이너리(lingua-tms)와 이름이 겹치지 않게 _lib 를 붙인다(Windows 빌드 충돌 방지).
name = "lingua_tms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tms-core = { path = "../crates/core" }
tms-measure = { path = "../crates/measure" }
serde = { workspace = true }
serde_json = { workspace = true }

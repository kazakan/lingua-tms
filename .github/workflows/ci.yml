# main push·PR마다 화면 빌드, clippy, Rust 테스트를 Windows에서 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      # 화면 타입 검사 + 빌드. src-tauri 빌드가 dist 를 참조하므로 Rust 단계보다 먼저 한다.
      - name: Frontend build
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 가짜 엔진 DLL을 target/debug 에 만들어 FFI 테스트가 실제로 돌게 한다.
      # cargo test 만으로는 cargo 버전에 따라 DLL이 다른 폴더(build/…/out 등)에 생겨 테스트가 못 찾는다.
      # DLL이 없으면 FFI 테스트는 실패하지 않고 건너뛴다(엔진 DLL은 없을 수 있음).
      - name: Build stub engine DLL
        run: |
          cargo build -p tms-engine-stub
          Get-ChildItem target/debug -Filter tms_measure_stub.dll

      - name: Test
        run: cargo test --workspace

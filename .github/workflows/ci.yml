# main push·PR마다 화면 빌드, clippy, Rust 테스트를 Windows에서 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      # 화면 타입 검사 + 빌드. src-tauri 빌드가 dist 를 참조하므로 Rust 단계보다 먼저 한다.
      - name: Frontend build
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 가짜 엔진 DLL(tms_measure_stub.dll)도 같이 빌드되어 FFI 테스트까지 돈다.
      # DLL을 못 찾으면 건너뛰지 말고 실패하게 한다.
      - name: Test
        run: cargo test --workspace
        env:
          TMS_REQUIRE_ENGINE_DLL: "1"
